name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
      - name: JavaScript UI tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check cmd/pc-bench/web/app.js
          node --check cmd/pc-bench/web/compare-model.js
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o pc-bench ./cmd/pc-bench
